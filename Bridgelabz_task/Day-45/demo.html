<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Payroll System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #f5f5f5; padding: 10px 20px; display: flex; align-items: center; }
    header .logo { display: flex; align-items: center; }
    header .logo img { height: 40px; margin-right: 10px; }
    header .logo span { font-size: 20px; font-weight: bold; }

    main { padding: 20px; }

    .title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .add-user { background: green; color: white; padding: 8px 12px; border: none; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #eee; }

    form { display: flex; flex-direction: column; max-width: 400px; }
    form label { margin-top: 10px; }
    form input, form select, form textarea { margin-bottom: 10px; padding: 5px; }
    form button { margin-top: 10px; padding: 8px; }
  </style>
</head>
<body>

  <!-- Shared Header -->
  <header>
    <div class="logo">
      <img src="https://via.placeholder.com/40" alt="Logo">
      <span>Employee Payroll</span>
    </div>
  </header>

  <!-- Home Page -->
  <main id="homePage">
    <div class="title-bar">
      <h2>Employee Details</h2>
      <button class="add-user" onclick="showForm()">+ Add User</button>
    </div>

    <table id="employeeTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Gender</th>
          <th>Department</th>
          <th>Salary</th>
          <th>Start Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be added dynamically -->
      </tbody>
    </table>
  </main>

  <!-- Add Employee Form -->
  <main id="formPage" style="display:none;">
    <h2>Employee Payroll Form</h2>
    <form id="payrollForm">
      <label>Name</label>
      <input type="text" id="name" required>

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label>Department</label>
      <input type="checkbox" value="HR"> HR
      <input type="checkbox" value="Sales"> Sales
      <input type="checkbox" value="Finance"> Finance

      <label>Salary</label>
      <input type="number" id="salary" required>

      <label>Start Date</label>
      <input type="date" id="startDate" required>

      <label>Notes</label>
      <textarea id="notes"></textarea>

      <div>
        <button type="button" onclick="cancelForm()">Cancel</button>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </div>
    </form>
  </main>

  <script>
    function showForm() {
      document.getElementById("homePage").style.display = "none";
      document.getElementById("formPage").style.display = "block";
    }

    function cancelForm() {
      document.getElementById("formPage").style.display = "none";
      document.getElementById("homePage").style.display = "block";
    }

    document.getElementById("payrollForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const gender = document.getElementById("gender").value;
      const salary = document.getElementById("salary").value;
      const startDate = document.getElementById("startDate").value;
      const notes = document.getElementById("notes").value;

      const departments = [];
      document.querySelectorAll("input[type=checkbox]:checked").forEach(cb => {
        departments.push(cb.value);
      });

      const tbody = document.querySelector("#employeeTable tbody");
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${name}</td>
        <td>${gender}</td>
        <td>${departments.join(", ")}</td>
        <td>₹${salary}</td>
        <td>${startDate}</td>
        <td><button>Edit</button> <button>Delete</button></td>
      `;
      tbody.appendChild(row);

      this.reset();
      cancelForm();
    });
  </script>

</body>
</html>
