<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Details Table</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
    }

    .table-main {
      width: 80%;
      margin: auto;
      overflow: auto;
    }

    .table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 15px;
      min-width: 800px;
    }

    th, td {
      text-align: left;
      padding: 5px 8px;
      border: 2px solid #D3D3D3;
    }

    th {
      background: #21515F;
      border-radius: 3px 3px 0px 0px;
      font-weight: 500;
      font-size: 14px;
      color: #FFFFFF;
    }

    td:first-child {
      display: flex;
      align-items: center;
    }

    td img:first-child {
      margin-right: 10px;
    }

    td img {
      cursor: pointer;
    }

    .dept-label {
      background-color: #e9f9f9;
      border-radius: 4px;
      width: fit-content;
      padding: 1px 7px;
      text-align: center;
      font-size: 14px;
      display: inline-block;
      font-weight: 300;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="table-main">
    <table id="display" class="table">
      <!-- UC 3 -->
      <tr>
        <th></th>
        <th>Name</th>
        <th>Gender</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Start Date</th>
        <th>Actions</th>
      </tr>
      <tr>
        <td>
          <img class="profile" alt="Profile" src="../assets/profile-images/Ellipse -2.png">
        </td>
        <td>Narayan Mahadevan</td>
        <td>Male</td>
        <td>
          <div class="dept-label">HR</div>
          <div class="dept-label">Finance</div>
        </td>
        <td>3000000</td>
        <td>Nov 2020</td>
        <td>
          <img id="1" onclick="remove(this)" alt="delete" src="../assets/icons/delete-black-18dp.svg">
          <img id="1" onclick="update(this)" alt="edit" src="../assets/icons/create-black-18dp.svg">
        </td>
      </tr>
    </table>
  </div>

</body>
</html>
