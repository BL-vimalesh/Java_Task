<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Payroll App</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,600;1,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* UC 1 */
    html, body {
      margin: 0;
      height: 100%;
    }

    .header {
      padding: 15px 0;
      background-color: #ffffff;
    }

    .header-content {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      border: 0px solid green;
    }

    .logo-content {
      display: flex;
      flex-direction: row;
      width: 80%;
      align-items: center;
      border: 0px solid green;
    }

    .logo-content img {
      height: 60px;
      margin-right: 15px;
      border: solid 0px #A2251F;
    }

    .emp-text {
      font: normal normal bold 20px/25px Montserrat;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0px;
      color: #82A2C4;
      text-transform: capitalize;
    }

    .emp-payroll {
      color: #A2251F;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- UC 1 Header -->
  <header class="header-content header">
    <div class="logo-content">
      <img src="./assets/images/logo.png" alt="BridgeLabz Logo">
      <div>
        <span class="emp-text">EMPLOYEE</span><br>
        <span class="emp-text emp-payroll">PAYROLL</span>
      </div>
    </div>
  </header>

</body>
</html>
