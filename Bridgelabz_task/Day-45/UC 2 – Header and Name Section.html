<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Payroll App</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* UC 2 */
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Roboto', sans-serif;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 80px);
      background-color: #f7f7f7;
      padding: 30px 18px;
      box-sizing: border-box;
    }

    .header-content {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 80%;
      margin: 0 auto;
      padding-bottom: 25px;
    }

    .emp-detail-text {
      font-weight: bold;
      font-size: 24px;
      line-height: 25px;
      color: #42515f;
    }

    .emp-count {
      background-color: #82a70c;
      color: #ffffff;
      border-radius: 42%;
      font-size: 16px;
      line-height: 16px;
      width: 26px;
      text-align: center;
      display: inline-block;
      margin-left: 10px;
    }

    .add-button {
      font-size: 22px;
      line-height: 29px;
      color: #ffffff;
      background: #82a70c;
      border: none;
      border-radius: 5px;
      padding: 5px 18px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .add-button img {
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <div class="main-content">
    <!-- UC 2 -->
    <div class="header-content">
      <div class="emp-detail-text">
        Employee Details <div class="emp-count">10</div>
      </div>
      <a href="../pages/new_payroll_form_js.html" class="add-button">
        <img src="../assets/icons/add-24px.svg" alt="Add Icon" width="24" height="24">Add User
      </a>
    </div>
  </div>

</body>
</html>
