<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Payroll Table from JSON</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 15px;
      min-width: 800px;
    }

    th, td {
      text-align: left;
      padding: 5px 8px;
      border: 2px solid #D3D3D3;
    }

    th {
      background: #21515F;
      color: #FFFFFF;
      font-weight: 500;
      font-size: 14px;
    }

    .dept-label {
      background-color: #e9f9f9;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 14px;
      display: inline-block;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .profile {
      height: 40px;
      border-radius: 50%;
    }

    td img {
      cursor: pointer;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <h2>Employee Payroll Table</h2>
  <table id="table-display">
    <!-- Content will be injected by JS -->
  </table>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      createInnerHtml();
    });

    const createEmployeePayrollJSON = () => {
      return [
        {
          _name: 'Narayan Mahadevan',
          _gender: 'Male',
          _department: ['Engineering', 'Finance'],
          _salary: '150000',
          _startDate: '29 Oct 2019',
          _note: '',
          _id: new Date().getTime(),
          _profilePic: 'https://via.placeholder.com/40?text=N'
        },
        {
          _name: 'Aarya Shashanka Keerthi Kumar',
          _gender: 'Female',
          _department: ['Sales'],
          _salary: '40000',
          _startDate: '29 Oct 2019',
          _note: '',
          _id: new Date().getTime() + 1,
          _profilePic: 'https://via.placeholder.com/40?text=A'
        }
      ];
    };

    const createInnerHtml = () => {
      const headerHtml = `
        <tr>
          <th></th>
          <th>Name</th>
          <th>Gender</th>
          <th>Department</th>
          <th>Salary</th>
          <th>Start Date</th>
          <th>Actions</th>
        </tr>`;

      const empList = createEmployeePayrollJSON();
      let rows = empList.map(emp => `
        <tr>
          <td><img class='profile' src='${emp._profilePic}' alt='Profile'/></td>
          <td>${emp._name}</td>
          <td>${emp._gender}</td>
          <td>${emp._department.map(dept => `<div class='dept-label'>${dept}</div>`).join('')}</td>
          <td>${emp._salary}</td>
          <td>${emp._startDate}</td>
          <td>
            <img name='${emp._id}' onclick='remove(this)' src='https://via.placeholder.com/18?text=D' alt='delete'>
            <img name='${emp._id}' onclick='update(this)' src='https://via.placeholder.com/18?text=E' alt='edit'>
          </td>
        </tr>`).join('');

      document.querySelector('#table-display').innerHTML = headerHtml + rows;
    };

    function remove(elem) {
      alert("Delete clicked for ID: " + elem.name);
    }

    function update(elem) {
      alert("Edit clicked for ID: " + elem.name);
    }
  </script>

</body>
</html>
