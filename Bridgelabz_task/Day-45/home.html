<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Payroll Home</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="BridgeLabz Logo">
      <span>Employee Payroll</span>
    </div>
  </header>

  <main>
    <div class="title-bar">
      <h2>Employee Details</h2>
      <button onclick="goToForm()">+ Add User</button>
    </div>

    <table id="employeeTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Gender</th>
          <th>Department</th>
          <th>Salary</th>
          <th>Start Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </main>

  <script src="home.js"></script>
</body>
</html>
